name: harness

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      config_ref:
        description: nvim-config ref to test against
        default: debuggers

env:
  # The branch the screens are committed on. The two repositories move
  # together and this is the seam between them; merging the stack removes it.
  CONFIG_REF: ${{ github.event.inputs.config_ref || 'debuggers' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: nidduzzi/nvim-config
          ref: ${{ env.CONFIG_REF }}
          path: .worktrees/nvim-lazyvim

      - run: |
          mkdir -p .worktrees/cfg
          ln -sfn "$GITHUB_WORKSPACE/.worktrees/nvim-lazyvim" .worktrees/cfg/nvim-lazyvim

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: the tools the picker looks for
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux fd-find ripgrep
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v fdfind)" "$HOME/.local/bin/fd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/nvim-lazyvim
            ~/.local/state/nvim-lazyvim
          key: nvim-${{ hashFiles('.worktrees/nvim-lazyvim/lazy-lock.json') }}

      - name: install plugins at the pinned commits
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.worktrees/cfg
          NVIM_APPNAME: nvim-lazyvim
        run: nvim --headless "+Lazy! restore" +qa

      - name: install the parsers the fixture needs
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.worktrees/cfg
          NVIM_APPNAME: nvim-lazyvim
        run: |
          nvim --headless -c 'lua require("nvim-treesitter").install({ "lua", "python", "javascript", "markdown", "markdown_inline", "bash", "json", "vim", "vimdoc", "query" }):wait(600000)' +qa
          nvim --headless -c 'lua local have = require("nvim-treesitter.config").get_installed("parsers") print(table.concat(have, " "))' +qa

      - name: the language server the screens need
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.worktrees/cfg
          NVIM_APPNAME: nvim-lazyvim
        run: |
          nvim --headless -c 'lua local p = require("mason-registry").get_package("lua-language-server") p:install() vim.wait(600000, function() return p:is_installed() end, 1000)' +qa
          nvim --headless -c 'lua print("lua_ls: " .. tostring(vim.fn.exepath("lua-language-server")))' +qa

      - run: tools/nvim-harness/make-fixture.sh --force

      - run: tools/nvim-harness/check-syntax.sh

      - run: python3 tools/nvim-harness/duplicate-keys.py .worktrees/nvim-lazyvim/lua

      - run: python3 tools/nvim-harness/rung-flags-match.py

      - run: tools/nvim-harness/check-key-names.sh

      - name: the keys that only exist inside a picker
        run: tools/nvim-harness/check-picker-keys.sh

      # The probes are the only thing that runs this configuration's modules
      # against a project rather than compiling them. One of them read a
      # function as a table for weeks: the file compiled, the probe died on
      # the line, and the gate printed the report from an earlier run.
      - name: the keys the capability list claims
        run: tools/nvim-harness/check-capability-keys.sh

      - name: the probes, against the fixture
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.worktrees/cfg
          NVIM_APPNAME: nvim-lazyvim
        run: tools/nvim-harness/run-probes.sh -p tools/nvim-harness/fixture

      - name: screens
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.worktrees/cfg
          NVIM_APPNAME: nvim-lazyvim
        run: tools/nvim-harness/screen-test.sh -l

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screens-drawn
          path: .worktrees/nvim-lazyvim/tests/screen/
          retention-days: 7

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every script
        run: |
          status=0
          while IFS= read -r script; do
            bash -n "$script" || { echo "syntax error: $script"; status=1; }
          done < <(find tools -name '*.sh')
          exit "$status"
