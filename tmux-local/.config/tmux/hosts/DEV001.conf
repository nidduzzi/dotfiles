# Settings that only apply to DEV001.
#
# allow-passthrough lets a program inside a pane send escape sequences straight
# to the outer terminal, which is how image protocols reach it. It is deliberately
# NOT set globally: on tmux builds compiled with sixel support, passing graphics
# data through has crashed the whole server, taking every session with it. Turn
# it on per machine, only where the tmux version is known good.
#
# See tools/tmux/sixel-crash-repro.sh for how this machine was tested.
