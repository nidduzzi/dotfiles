set -g @resurrect-processes '"~nvim" "~vim" "~claude" "~lazygit" "~btop" "~htop" "~less" "~tail" ssh psql mysql sqlite3'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-hook-post-save-layout '~/.config/tmux/scripts/resurrect-repair-save.sh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
