# tmux-resurrect: what to bring back, and how.
#
# By default resurrect saves a pane's command name but not its arguments, so a
# restored pane is a bare shell. The saved file shows this as an empty final
# field, and restore.sh skips any pane whose full command is empty.
#
# That is why restored panes feel like they are in the wrong place. resurrect
# records `pane_current_path`, the cwd of the pane's foreground process. Run
# `nvim ~/projects/thing/file.lua` from your home directory and nvim never
# changes directory, so the pane's cwd really is your home directory. resurrect
# saves it faithfully, restores you there, and the files you were editing are
# gone. The pane title said "thing" only because nvim set it.
#
# Restoring the program together with its arguments fixes the part that
# matters: the files come back, whatever the cwd was.
#
# A name prefixed with ~ is restored with its full command line. Names without
# it are restored by name alone.
set -g @resurrect-processes '"~nvim" "~vim" "~claude" "~lazygit" "~btop" "~htop" "~less" "~tail" ssh psql mysql sqlite3'

# Keep what was on screen, so a restored pane still shows the output you were
# reading rather than an empty prompt.
set -g @resurrect-capture-pane-contents 'on'

# Restore the Neovim session for the directory, which persistence.nvim writes
# per directory, rather than only reopening the files named on the command line.
set -g @resurrect-strategy-nvim 'session'

# Save every 15 minutes and restore on server start. Continuum is what makes
# the server's own death survivable, so leave it on.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
